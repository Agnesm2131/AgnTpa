      target-head:
        slot: 13
      accept:
        slot: 15
        material: "GREEN_STAINED_GLASS_PANE"
        name: "§aOnayla"
        lore:
          - "§7İsteği kabul et."
      deny:
        slot: 11
        material: "RED_STAINED_GLASS_PANE"
        name: "§cReddet"
        lore:
          - "§7İsteği reddet."

